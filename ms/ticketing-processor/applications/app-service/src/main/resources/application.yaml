server:
  port: 8081
spring:
  application:
    name: TicketingProcessor
  devtools:
    add-properties: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "${AWS_DYNAMODB_ENDPOINT:http://localhost:4566}"
    table-name: "events-dev"
    orders-table-name: "orders-dev"
entrypoint:
  sqs:
    region: "us-east-1"
    endpoint: "${ENTRYPOINT_SQS_ENDPOINT:http://localhost:4566}"
    queue-url: "${ENTRYPOINT_SQS_QUEUE_URL:http://localhost:4566/000000000000/ticketing-queue-dev}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 30
    numberOfThreads: 2
scheduler:
  release-expired:
    delay-ms: 60000
